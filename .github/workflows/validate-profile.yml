name: Profile validation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile README
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run profile updater contract tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Compile profile scripts
        run: python3 -m py_compile scripts/update_profile_followers.py scripts/test_profile_metrics.py

      - name: Validate README markers and generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          readme = Path("README.md").read_text(encoding="utf-8")
          for marker in (
              "profile-stats",
              "profile-followers",
              "profile-sponsors",
              "profile-projects",
              "profile-featured",
          ):
              if readme.count(f"<!-- {marker}:start -->") != 1:
                  raise SystemExit(f"expected exactly one {marker} start marker")
              if readme.count(f"<!-- {marker}:end -->") != 1:
                  raise SystemExit(f"expected exactly one {marker} end marker")

          for chart in (
              "assets/profile-activity-mix.svg",
              "assets/profile-language-radar.svg",
              "assets/profile-language-bars.svg",
          ):
              root = ET.parse(chart).getroot()
              if not root.tag.endswith("svg"):
                  raise SystemExit(f"{chart} does not contain an SVG root")

          metrics = json.loads(Path("assets/profile-metrics.json").read_text(encoding="utf-8"))
          required_metrics = {
              "schema_version",
              "public_repositories",
              "original_repositories",
              "project_stars",
              "project_forks",
          }
          if set(metrics) != required_metrics or metrics["schema_version"] != 1:
              raise SystemExit("profile-metrics.json does not match the supported schema")
          if any(not isinstance(metrics[key], int) or metrics[key] < 0 for key in required_metrics - {"schema_version"}):
              raise SystemExit("profile metrics must contain non-negative integers")

          print("README markers, generated SVGs, and public metrics are valid")
          PY
