name: Refresh profile stats, followers, and public sponsors

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-profile-followers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out the profile README
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Prepare the managed update branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/profile-metrics"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          git checkout -B "$branch" origin/main

      - name: Refresh public follower, repository, and sponsor data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile_followers.py

      - name: Validate metrics and generated SVGs
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Commit and open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_EXISTS: ${{ steps.branch.outputs.exists }}
        run: |
          set -euo pipefail
          branch="automation/profile-metrics"
          pr_number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"

          if git diff --quiet -- README.md assets/profile-language-mix.svg assets/profile-language-radar.svg; then
            if [[ -n "$pr_number" ]]; then
              gh pr merge "$pr_number" --auto --squash --delete-branch
            fi
            echo "Profile metrics are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile-language-mix.svg assets/profile-language-radar.svg
          git commit -m "chore(profile): refresh dynamic metrics"

          if [[ "$BRANCH_EXISTS" == "true" ]]; then
            git push --force-with-lease origin "$branch"
          else
            git push --set-upstream origin "$branch"
          fi

          expected_sha="$(git rev-parse HEAD)"
          gh workflow run validate-profile.yml --ref "$branch"

          validation_run=""
          for attempt in $(seq 1 60); do
            validation_run="$(gh run list \
              --workflow validate-profile.yml \
              --branch "$branch" \
              --limit 10 \
              --json databaseId,event,headSha \
              --jq "[.[] | select(.event == \"workflow_dispatch\" and .headSha == \"$expected_sha\")] | sort_by(.databaseId) | last | .databaseId // empty")"
            if [[ -n "$validation_run" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$validation_run" ]]; then
            echo "Profile validation workflow was not created for $expected_sha" >&2
            exit 1
          fi

          for attempt in $(seq 1 90); do
            validation="$(gh run view "$validation_run" --json status,conclusion)"
            status="$(jq -r '.status' <<<"$validation")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$validation")"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "Profile validation failed for $expected_sha ($conclusion)" >&2
                gh run view "$validation_run" --log-failed >&2 || true
                exit 1
              fi
              break
            fi
            if [[ "$attempt" == "90" ]]; then
              echo "Profile validation timed out for $expected_sha" >&2
              exit 1
            fi
            sleep 2
          done

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --title "chore(profile): refresh dynamic metrics" \
              --body "Refresh generated public GitHub metrics and public sponsor acknowledgments."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(profile): refresh dynamic metrics" \
              --body "Refresh generated public GitHub metrics and public sponsor acknowledgments."
          fi

          pr_number="$(gh pr view "$branch" --json number --jq .number)"
          gh pr merge "$pr_number" --auto --squash --delete-branch
